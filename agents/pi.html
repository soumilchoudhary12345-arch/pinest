<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08070a">
<title>Agents</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/pi.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14.5 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
    <symbol id="i-linux" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="11.5" rx="1.8"/><path d="M8 20h8M12 16.5V20"/><path d="m7.5 9 2.2 1.8-2.2 1.8M11.5 12.6h3.5"/></symbol>
    <symbol id="i-win" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="11.5" rx="1.8"/><path d="M8 20h8M12 16.5V20"/><path d="M8.5 8.5h3v3h-3zM12.5 8.5h3v3h-3zM8.5 12.5h3M12.5 12.5h3"/></symbol>
  </defs>
</svg>

<header class="bar">
  <button class="bar-btn" id="back" type="button" aria-label="All devices" hidden><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
  <h1 class="bar-title" id="title">Agents</h1>
  <span class="bar-live" id="live" aria-live="polite"></span>
  <button class="bar-btn quit" id="quit" type="button" aria-label="Close Agents"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
</header>

<main class="view" id="view" aria-live="polite"></main>

<nav class="pager" id="pager" aria-label="Pages">
  <button class="pg" id="pgUp" type="button" aria-label="Previous page"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg></button>
  <span class="pg-num" id="pgNum"></span>
  <button class="pg" id="pgDown" type="button" aria-label="Next page"><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></button>
</nav>

<script src="/pi.js"></script>
</body>
</html>

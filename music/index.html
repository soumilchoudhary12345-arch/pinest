<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<meta name="description" content="Musik — your music library, streaming from the Raspberry Pi.">
<title>Musik</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M8.5 5.2v13.6L19 12z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7.6 5h3.1v14H7.6zM13.3 5h3.1v14h-3.1z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M18 6.2v11.6L9.6 12zM6 6h2.2v12H6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M6 6.2v11.6l8.4-5.8zM15.8 6H18v12h-2.2z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3.5 7h3.2c2.2 0 3.4 1 4.6 3l1.4 4c1.2 2 2.4 3 4.6 3h3.2"/><path d="M3.5 17h3.2c1.4 0 2.4-.4 3.2-1.2M13.5 8.2c.8-.8 1.8-1.2 3.2-1.2h3.2"/><path d="m18 4.5 2.5 2.5L18 9.5M18 14.5l2.5 2.5-2.5 2.5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4.5 11V9.5A2.5 2.5 0 0 1 7 7h12.5"/><path d="m17 4.5 2.5 2.5L17 9.5"/><path d="M19.5 13v1.5A2.5 2.5 0 0 1 17 17H4.5"/><path d="M7 19.5 4.5 17 7 14.5"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M4.5 11V9.5A2.5 2.5 0 0 1 7 7h12.5"/><path d="m17 4.5 2.5 2.5L17 9.5"/><path d="M19.5 13v1.5A2.5 2.5 0 0 1 17 17H4.5"/><path d="M7 19.5 4.5 17 7 14.5"/><path d="M11.2 10.6 12.6 9.8v5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 6.8a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10-7.5 10z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14.5 6-6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.2h-4.2"/></symbol>
  </defs>
</svg>

<div class="app">
  <!-- Library -->
  <section class="library" aria-label="Library">
    <header class="lib-head">
      <div class="brand">
        <span class="wordmark">Musik</span>
        <span class="count" id="count"></span>
      </div>
      <label class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <span class="sr-only">Search your library</span>
        <input id="q" type="search" placeholder="Search songs and artists" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <nav class="tabs" id="tabs" aria-label="Library views">
        <button type="button" data-view="songs" aria-pressed="true">Songs</button>
        <button type="button" data-view="artists" aria-pressed="false">Artists</button>
        <button type="button" data-view="albums" aria-pressed="false" hidden>Albums</button>
        <button type="button" data-view="liked" aria-pressed="false">Liked</button>
        <button type="button" data-view="queue" aria-pressed="false">Queue</button>
        <button type="button" class="quit" id="quit" aria-label="Close Musik" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </nav>
    </header>
    <div class="list-wrap" id="listWrap">
      <div id="list" class="list"></div>
    </div>
    <!-- Pi touchscreen: page buttons instead of scrolling -->
    <div class="pager" id="pager" hidden>
      <button class="icon-btn" id="pgUp" type="button" aria-label="Previous page">
        <svg class="icon" aria-hidden="true"><use href="#i-up"/></svg>
      </button>
      <span class="pg-num" id="pgNum"></span>
      <button class="icon-btn" id="pgDown" type="button" aria-label="Next page">
        <svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>
      </button>
    </div>
  </section>

  <!-- Now playing -->
  <section class="stage" id="stage" aria-label="Now playing">
    <div class="room" aria-hidden="true"><div class="room-light" id="roomLight"></div></div>
    <button class="stage-close icon-btn" id="closeStage" type="button" aria-label="Close player">
      <svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>
    </button>
    <div class="stage-inner">
      <figure class="art" id="art"></figure>
      <div class="meta">
        <h1 class="title" id="title">Pick a song</h1>
        <p class="artist" id="artist">Your library is on the left</p>
      </div>
      <div class="transport">
        <button class="icon-btn" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-shuffle"/></svg>
        </button>
        <button class="icon-btn big" id="prev" type="button" aria-label="Previous">
          <svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg>
        </button>
        <button id="play" class="play" type="button" aria-label="Play" disabled>
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="55"></circle>
            <circle class="ring-fg" cx="60" cy="60" r="55"></circle>
          </svg>
          <svg class="glyph icon-play" aria-hidden="true"><use href="#i-play"/></svg>
          <svg class="glyph icon-pause" aria-hidden="true"><use href="#i-pause"/></svg>
        </button>
        <button class="icon-btn big" id="next" type="button" aria-label="Next">
          <svg class="icon" aria-hidden="true"><use href="#i-next"/></svg>
        </button>
        <button class="icon-btn" id="repeat" type="button" aria-label="Repeat: off" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg>
        </button>
      </div>
      <div class="bar">
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1"
               disabled aria-label="Playback position">
        <div class="times">
          <span id="cur">0:00</span>
          <button class="like" id="like" type="button" aria-label="Like" aria-pressed="false" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg>
          </button>
          <span id="dur">0:00</span>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </section>
</div>

<!-- Phone mini player -->
<div class="mini" id="mini" hidden>
  <div class="mini-progress"><span id="miniProgress"></span></div>
  <button class="mini-open" id="miniOpen" type="button" aria-label="Open player">
    <span class="mini-art" id="miniArt"></span>
    <span class="mini-text">
      <span class="mini-title" id="miniTitle"></span>
      <span class="mini-artist" id="miniArtist"></span>
    </span>
  </button>
  <button class="icon-btn" id="miniPlay" type="button" aria-label="Play">
    <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
  </button>
  <button class="icon-btn" id="miniNext" type="button" aria-label="Next">
    <svg class="icon" aria-hidden="true"><use href="#i-next"/></svg>
  </button>
</div>

<audio id="player" preload="metadata"></audio>
<script src="/app.js"></script>
</body>
</html>
